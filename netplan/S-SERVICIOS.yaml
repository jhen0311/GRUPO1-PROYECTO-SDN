# S-SERVICIOS: /etc/netplan/60-tel354.yaml (ens3 gestión + ens4 datos)
network:
  version: 2
  ethernets:
    ens3:
      addresses:
        - 192.168.0.31/24
      routes:
        - to: default
          via: 192.168.0.1
      nameservers:
        addresses:
          - 8.8.8.8
      dhcp4: false
      dhcp6: false
      accept-ra: false
      link-local: []
    ens4:
      addresses:
        - 10.200.0.5/24
        - 10.200.0.13/24
        - 10.200.0.14/24
        - 10.200.0.2/24
      routes:
        - to: 10.0.0.0/8
          via: 10.200.0.1
        - to: 172.16.0.0/16
          via: 10.200.0.1
      dhcp4: false
      dhcp6: false
      accept-ra: false
      link-local: []
