# S-CURSOS: /etc/netplan/60-tel354.yaml (ens3 gestión + ens4 datos)
network:
  version: 2
  ethernets:
    ens3:
      addresses:
        - 192.168.0.34/24
      routes:
        - to: default
          via: 192.168.0.1
      nameservers:
        addresses:
          - 8.8.8.8
      dhcp4: false
      dhcp6: false
      accept-ra: false
      link-local: []
    ens4:
      addresses:
        - 10.200.2.10/24
        - 10.200.2.20/24
        - 10.200.2.30/24
        - 10.200.2.2/24
      routes:
        - to: 10.0.0.0/8
          via: 10.200.2.1
        - to: 172.16.0.0/16
          via: 10.200.2.1
      dhcp4: false
      dhcp6: false
      accept-ra: false
      link-local: []
