# M1 (dentro de ONOS) actúa como NAS: es el único cliente RADIUS de la red.
client onos_m1 {
	ipaddr = 172.16.0.10
	secret = ${RADIUS_SECRET}
	shortname = onos-m1
	require_message_authenticator = yes
}
# Pruebas locales (eapol_test desde el propio host svc o desde ctl)
client pruebas_locales {
	ipaddr = 127.0.0.1
	secret = ${RADIUS_SECRET}
	shortname = pruebas
}
